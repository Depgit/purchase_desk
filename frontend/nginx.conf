# Serves the built React app and forwards /api to the Go API.
server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 70m;
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 180s;
  }
  # Built files carry a hash in their name, so they can be kept for a year; the page itself is always re-checked,
  # so a browser picks up a new deploy on its next load.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
